<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | MyAhsan Villa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase Client CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 flex items-center justify-center h-screen">

    <!-- Login Box -->
    <div id="login-box" class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center">Admin Access</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Email</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-xl font-medium hover:bg-emerald-700 transition">Log In</button>
        </form>
    </div>

    <!-- Dashboard Panel (Hidden by default) -->
    <div id="dashboard" class="hidden bg-white p-8 rounded-2xl shadow-md w-full max-w-2xl">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">Rental Upload Manager</h2>
            <button id="logout-btn" class="text-rose-600 text-sm font-medium hover:underline">Log Out</button>
        </div>
        <form id="upload-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Item Title</label>
                <input type="text" id="item-title" required class="w-full px-4 py-2 border rounded-xl">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Description & Price</label>
                <textarea id="item-desc" required class="w-full px-4 py-2 border rounded-xl"></textarea>
            </div>
            <button type="submit" class="bg-slate-900 text-white px-6 py-2 rounded-xl font-medium hover:bg-slate-800">Publish Item</button>
        </form>
    </div>

    <script>
        // Initialize Supabase (Replace with your actual keys from Supabase project settings)
        const SUPABASE_URL = 'https://qnojuhdoarwosqxjfpdv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFub2p1aGRvYXJ3b3NxeGpmcGR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MDk1MTgsImV4cCI6MjEwNDE4NTUxOH0.ruKw1iNnwuygLWrHDs2RZtC6riaJ0t0MCzEz4wcKtCo';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginBox = document.getElementById('login-box');
        const dashboard = document.getElementById('dashboard');
        const loginForm = document.getElementById('login-form');

        // Handle Login Submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Login failed: ' + error.message);
            } else {
                toggleView(true);
            }
        });

        function toggleView(isLoggedIn) {
            if (isLoggedIn) {
                loginBox.classList.add('hidden');
                dashboard.classList.remove('hidden');
            } else {
                loginBox.classList.remove('hidden');
                dashboard.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
