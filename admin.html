<!-- admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Ahsanvila</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 flex items-center justify-center min-h-screen p-6">

    <!-- Login Box -->
    <div id="login-box" class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-2 text-center">Ahsanvila Admin Login</h2>
        <p class="text-xs text-slate-400 text-center mb-6">Manage flats 101, 102, 301, and 302</p>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Admin Email</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Password</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-xl font-medium hover:bg-emerald-700 transition">Log In</button>
        </form>
        <div class="mt-4 text-center">
            <a href="index.html" class="text-xs text-slate-500 hover:underline">&larr; Back to Home</a>
        </div>
    </div>

    <!-- Dashboard Panel (Hidden Until Logged In) -->
    <div id="dashboard" class="hidden bg-white p-8 rounded-2xl shadow-md w-full max-w-xl">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-xl font-bold">Ahsanvila Flat Manager</h2>
                <p class="text-xs text-slate-500">Update pricing, description, and status for flats 101, 102, 301, 302</p>
            </div>
            <button id="logout-btn" class="text-rose-600 text-sm font-medium hover:underline">Log Out</button>
        </div>
        
        <form id="upload-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Select Flat</label>
                <select id="flat-number" required class="w-full px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                    <option value="101">1st Floor - Flat 101</option>
                    <option value="102">1st Floor - Flat 102</option>
                    <option value="301">3rd Floor - Flat 301</option>
                    <option value="302">3rd Floor - Flat 302</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Flat Title</label>
                <input type="text" id="item-title" placeholder="e.g., Luxury 1100 Sq Ft Apartment" required class="w-full px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Monthly Rent Amount</label>
                <input type="text" id="item-price" placeholder="e.g., ৳25,000" required class="w-full px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Availability Status</label>
                <select id="flat-status" required class="w-full px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                    <option value="Free For Rent">Free For Rent</option>
                    <option value="Occupied">Occupied</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Description</label>
                <textarea id="item-desc" rows="3" placeholder="Details about rooms, facilities, deep tubewell water access, etc." required class="w-full px-4 py-2 border rounded-xl outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
            </div>

            <button type="submit" class="w-full bg-slate-900 text-white py-2.5 rounded-xl font-medium hover:bg-slate-800 transition">Save Flat Update</button>
        </form>
    </div>

    <script>
        const SUPABASE_URL = 'https://qnojuhdoarwosqxjfpdv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFub2p1aGRvYXJ3b3NxeGpmcGR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MDk1MTgsImV4cCI6MjEwNDE4NTUxOH0.ruKw1iNnwuygLWrHDs2RZtC6riaJ0t0MCzEz4wcKtCo';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const loginBox = document.getElementById('login-box');
        const dashboard = document.getElementById('dashboard');
        const loginForm = document.getElementById('login-form');
        const uploadForm = document.getElementById('upload-form');
        const logoutBtn = document.getElementById('logout-btn');
        const flatSelect = document.getElementById('flat-number');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Login failed: ' + error.message);
            } else {
                toggleView(true);
                loadSelectedFlatData(flatSelect.value);
            }
        });

        // Load existing flat details into form when selector changes
        async function loadSelectedFlatData(flatNumber) {
            const { data, error } = await supabaseClient
                .from('rentals')
                .select('*')
                .eq('flat_number', flatNumber)
                .single();

            if (data) {
                document.getElementById('item-title').value = data.title || '';
                document.getElementById('item-price').value = data.price || '';
                document.getElementById('flat-status').value = data.status || 'Free For Rent';
                document.getElementById('item-desc').value = data.description || '';
            } else {
                document.getElementById('item-title').value = '';
                document.getElementById('item-price').value = '';
                document.getElementById('flat-status').value = 'Free For Rent';
                document.getElementById('item-desc').value = '';
            }
        }

        flatSelect.addEventListener('change', (e) => {
            loadSelectedFlatData(e.target.value);
        });

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const flat_number = flatSelect.value;
            const title = document.getElementById('item-title').value;
            const price = document.getElementById('item-price').value;
            const status = document.getElementById('flat-status').value;
            const description = document.getElementById('item-desc').value;

            // Use upsert with onConflict on flat_number so it updates the existing row instead of creating duplicates
            const { error } = await supabaseClient
                .from('rentals')
                .upsert([{ flat_number, title, price, status, description }], { onConflict: 'flat_number' });
            
            if (error) {
                alert('Error updating flat: ' + error.message);
            } else {
                alert(`Flat ${flat_number} details updated successfully!`);
            }
        });

        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            toggleView(false);
        });

        function toggleView(isLoggedIn) {
            if (isLoggedIn) {
                loginBox.classList.add('hidden');
                dashboard.classList.remove('hidden');
            } else {
                loginBox.classList.remove('hidden');
                dashboard.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
